[package]
name = "d1fw-ee-hand"
description = "What a multi-finger hand provider is built from: the hand state it publishes as hand.state/1, the serialized link with command priority, the probe band, the flange channel as a CAN FD bus, a simulated device and the end module's repeat suppression, and the provider process around a hand model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The scenario a hand crate's tests drive its provider with, on the SDK's
# host (d1fw-ee-harness), and the cross-process conformance run.
test-support = ["dep:d1fw-ee-harness"]

[dependencies]
d1fw-canfd.workspace = true
d1fw-ee-provider.workspace = true
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
d1fw-ee-harness = { workspace = true, optional = true }

[dev-dependencies]
jsonschema.workspace = true
