[package]
name = "d1fw-ee-manifest"
description = "The provider manifest omakase-ee-provider/1: its JSON Schema, the Rust type, the rules a schema cannot state, the check of a manifest against a provider's live descriptor, and the d1fw-ee-manifest command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "d1fw-ee-manifest"
path = "src/bin/d1fw_ee_manifest.rs"

# No dependency on the shared-memory crates: the manifest is checked on a
# developer's machine and in a release job, where iceoryx2 has no use.
[dependencies]
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
jsonschema.workspace = true
thiserror.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true
